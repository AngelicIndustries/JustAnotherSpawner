dependencies {
    // Optional Biomic integration, only called from spawner/biome/group/BiomicBiomes when Biomic is installed.
    compileOnly("industries.angelic.biomic:Biomic:34682eb-snapshot:dev") { transitive = false }
    // Biomic's Java 8 classes extend JVM Downgrader's record stub, which javac needs to read them.
    compileOnly("xyz.wagyourtail.jvmdowngrader:jvmdowngrader-java-api:2.0.1:downgraded-8") { transitive = false }
}
